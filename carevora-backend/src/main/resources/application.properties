# ==========================================
# Security & JWT Token Configurations
# ==========================================
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# CORS Origins Configuration (explicit localhost, 127.0.0.1, and Android emulator 10.0.2.2)
application.cors.allowed-origins=http://localhost:[*],http://127.0.0.1:[*],http://10.0.2.2:[*]

# OpenAPI Swagger UI Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# AI / ML Microservice Configuration
# ==========================================
application.ai-service.base-url=http://127.0.0.1:8000
